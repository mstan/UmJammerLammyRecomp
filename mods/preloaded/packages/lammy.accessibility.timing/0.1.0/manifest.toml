format_version = 7
id = "lammy.accessibility.timing"
version = "0.1.0"
name = "Rhythm Timing Assist"
author = "mstan"
description = "Adjust rhythm judgement for display, controller and audio delay."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94448"

[[feature]]
id = "judgement"
name = "Rhythm Timing Assist"
description = "Adds early and late tolerance for live players. Experimental: initial gameplay needs player validation. Button matching, scoring, music and visuals retain the game's rules."
group = "Accessibility"
channel = "experimental"
default_enabled = false

[[option]]
feature = "judgement"
id = "offset_ms"
label = "Latency compensation (ms)"
description = "Positive values judge your presses earlier; negative values judge them later. Start at zero and adjust in small steps."
type = "integer"
min = -300
max = 300
step = 5
default = 0

[[option]]
feature = "judgement"
id = "early_ms"
label = "Extra early tolerance (ms)"
description = "Extra tolerance beyond the stock window. Rounded to musical ticks and capped at four extra ticks, the midpoint between neighbouring notes."
type = "integer"
min = 0
max = 60
step = 5
default = 10

[[option]]
feature = "judgement"
id = "late_ms"
label = "Extra late tolerance (ms)"
description = "Extra tolerance beyond the stock window. Rounded to musical ticks and capped at four extra ticks. Zero keeps stock late tolerance."
type = "integer"
min = 0
max = 60
step = 5
default = 10

[[patch]]
feature = "judgement"
target = "main_exe"
address = 0x8001b6d8
expected = "21 28 20 02"
replace = "21 28 11 00"
# ADDU a1,s1,zero -> ADDU a1,zero,s1; identical operation enables hooks.

[[patch]]
feature = "judgement"
target = "main_exe"
address = 0x8001b0e0
expected = "21 10 e0 00"
replace = "21 10 07 00"
# ADDU v0,a3,zero -> ADDU v0,zero,a3; identical operation enables hooks.

[[plugin]]
feature = "judgement"
id = "lammy.timing"
